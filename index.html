<style>
:root{--paper:#fff7ea;--ink:#4a2a35}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b1030;overflow:hidden;font-family:'Caveat','Segoe UI',cursive;color:#fff;-webkit-tap-highlight-color:transparent}

/* ---------- Scene 1 ---------- */
#s1{position:fixed;inset:0;transition:opacity .9s}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;top:8%;left:0;right:0;text-align:center;font-family:'Dancing Script',cursive;font-size:clamp(1.5rem,6.2vw,2.3rem);opacity:0;transition:opacity 1.2s;text-shadow:0 0 18px #ff8fb1;pointer-events:none;padding:0 12px}
.hint.on{opacity:1}
.sign{position:absolute;left:50%;width:min(88vw,430px);transform:translateX(-50%) scale(.6);opacity:0;transition:opacity 1s,transform 1s cubic-bezier(.2,1.4,.4,1);text-align:center;pointer-events:none}
.sign.on{opacity:1;transform:translateX(-50%) scale(1)}
.plank{position:relative;padding:12px 10px 14px;border-radius:8px;background:linear-gradient(180deg,#b97a45,#8d5528 55%,#a06632);box-shadow:inset 0 2px 0 rgba(255,220,170,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.5);
 font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(1.7rem,7.6vw,2.7rem);line-height:1.1;color:#fff4d6;text-shadow:0 2px 0 #5a3012,0 0 14px rgba(255,200,120,.55)}
.plank::before,.plank::after{content:"";position:absolute;top:100%;width:12px;height:26px;background:linear-gradient(90deg,#6e4220,#a06632,#6e4220);border-radius:0 0 3px 3px}
.plank::before{left:18%}.plank::after{right:18%}
.nail{position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:#e8d3a5;box-shadow:inset -1px -1px 1px #7b5b2c}
.nail.l{left:8px}.nail.r{right:8px}
#next{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;border:0;cursor:pointer;
 padding:13px 30px;border-radius:40px;font-family:'Caveat',cursive;font-weight:700;font-size:1.6rem;color:#fff;background:linear-gradient(135deg,#ff5f8f,#ff2e63 60%,#d81b60);box-shadow:0 6px 22px rgba(255,46,99,.55),inset 0 1px 0 rgba(255,255,255,.4);
 transition:opacity .8s,transform .8s}
#next.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 22px rgba(255,46,99,.5)}50%{box-shadow:0 6px 34px rgba(255,46,99,.95),0 0 0 8px rgba(255,46,99,.15)}}

/* ---------- Scene 2 ---------- */
#s2{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transition:opacity 1s;
 background:radial-gradient(900px 500px at 15% 0%,rgba(255,120,170,.18),transparent 60%),radial-gradient(800px 500px at 90% 30%,rgba(140,90,255,.18),transparent 60%),linear-gradient(#150b2e,#2b1244 50%,#4a1d52)}
#s2.on{opacity:1;visibility:visible}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.bg span{position:absolute;bottom:-40px;color:#ff6b97;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.wrap{max-width:820px;margin:0 auto;padding:0 12px calc(60px + env(safe-area-inset-bottom));position:relative;z-index:2}
.lights{position:relative;height:60px;margin:0 -12px}
.lights svg{position:absolute;inset:0;width:100%;height:100%}
.bulb{position:absolute;width:12px;height:16px;border-radius:50% 50% 55% 55%;margin-left:-6px;animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.45;filter:brightness(.8)}50%{opacity:1;filter:brightness(1.4)}}
.gtitle{font-family:'Dancing Script',cursive;font-weight:700;text-align:center;font-size:clamp(2rem,9vw,3.3rem);margin:6px 0 4px;text-shadow:0 0 22px #ff7ab0}
.sub{text-align:center;font-size:1.3rem;opacity:.85;margin-bottom:10px}
.hero{position:relative;width:min(80vw,330px);margin:76px auto 46px;transform-origin:50% -60px;animation:sway 6s ease-in-out infinite alternate;--r:-1.5deg;cursor:pointer}
.hero .fr{background:linear-gradient(#fff9e8,#f3dfae);padding:12px 12px 52px;border-radius:3px;box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 3px #e7c46a,0 0 40px rgba(255,200,110,.35);position:relative}
.hero img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#2a1a3e}
.hero .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:'Dancing Script',cursive;font-weight:700;font-size:1.9rem;color:#8a2a4e}
.rib{position:absolute;left:50%;bottom:100%;width:3px;height:70px;background:linear-gradient(#ffe29a,#d9a23a);transform-origin:bottom center;border-radius:2px}
.rib.a{transform:rotate(-24deg)}.rib.b{transform:rotate(24deg)}
.knot{position:absolute;left:50%;top:-8px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9b0,#d9a23a);box-shadow:0 2px 4px rgba(0,0,0,.4);z-index:3}
.deco{position:absolute;font-size:1.7rem;filter:drop-shadow(0 0 6px rgba(255,120,170,.8));animation:tw 2.4s ease-in-out infinite}
@keyframes sway{from{transform:rotate(calc(var(--r) - 1.6deg))}to{transform:rotate(calc(var(--r) + 1.6deg))}}
.row{position:relative;width:100%;display:flex;justify-content:center;gap:14px;padding-top:14px;margin-bottom:34px}
.rope{position:absolute;left:0;top:0;width:100%;height:44px;pointer-events:none}
.ph{position:relative;transform-origin:50% 0;animation:sway var(--d) ease-in-out infinite alternate;cursor:pointer;width:min(calc((100% - 14px*(var(--n) - 1))/var(--n)),230px)}
.ph .fr{position:relative;background:#fffaf0;padding:7px 7px 28px;border-radius:2px;box-shadow:0 10px 20px rgba(0,0,0,.5)}
.ph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#2a1a3e}
.ph .fr::after{content:"♥";position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#e0507a;font-size:15px;line-height:1}
.pin{position:absolute;top:-12px;left:50%;width:12px;height:28px;margin-left:-6px;border-radius:3px;background:linear-gradient(90deg,#b9803f,#ebbc7c,#a86f30);box-shadow:0 2px 3px rgba(0,0,0,.5);z-index:3}
.pin::after{content:"";position:absolute;left:5px;top:8px;width:2px;height:18px;background:rgba(60,30,10,.55)}
.letter{position:relative;max-width:600px;margin:36px auto 0;background:linear-gradient(#fffaf0,#fff2dc);color:var(--ink);padding:34px 24px 30px;border-radius:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);font-size:clamp(1.3rem,4.8vw,1.65rem);line-height:1.45}
.letter::before{content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:rgba(255,200,215,.8);transform:rotate(-3deg);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.letter h3{font-family:'Dancing Script',cursive;font-weight:700;font-size:1.25em;color:#c2185b;text-align:center;margin-bottom:12px}
.letter p{margin-bottom:12px;text-align:center}
.letter .sig{font-family:'Dancing Script',cursive;font-weight:700;font-size:1.3em;color:#c2185b;margin-top:6px;margin-bottom:0}
.again{display:block;margin:34px auto 0;border:0;cursor:pointer;padding:11px 26px;border-radius:30px;font-family:'Caveat',cursive;font-weight:700;font-size:1.4rem;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35)}
#lb{position:fixed;inset:0;background:rgba(5,2,15,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:4px;box-shadow:0 0 40px rgba(255,120,170,.4)}
</style>
</head>

<script>
/* ======== YAHAN BADLO ======== */
const HERO_PHOTO='https://i.ibb.co/BHSXBRV2/IMG-20261010-092547-598.jpg';
const PHOTOS=[
 'https://i.ibb.co/1Jp4TMcB/IMG-20261010-092557-230.jpg',
 'https://i.ibb.co/0Lj1Dtm/IMG-20261010-092551-604.jpg',
 'https://i.ibb.co/ch4KBxjd/IMG-20261010-092553-695.jpg',
 'https://i.ibb.co/SDwWMvrq/IMG-20261010-092549-462.jpg',
 'https://i.ibb.co/BHSXBRV2/IMG-20261010-092547-598.jpg',
 'https://i.ibb.co/Ldddp3Pb/IMG-20261010-092542-426.jpg',
 'https://i.ibb.co/dNcTJgR/IMG-20261010-092540-512.jpg',
 'https://i.ibb.co/r2StbRW3/IMG-20261010-092538-048.jpg',
 'https://i.ibb.co/1Jp4TMcB/IMG-20261010-092557-230.jpg'
];
const PASSAGE={
 title:'Happy Birthday 🎂',
 paras:[
  "Happy Birthday! 🎂 Wishing you a day as beautiful as your heart, filled with laughter, love, and every little thing that makes you smile. May this new year of your life bring you peace, success, and all the happiness you so deeply deserve. Thank You for Coming Into My Life........A Few Words From the Heart hihihihi.....Some people arrive in your life like a season. You dont notice exactly when the weather changed, but one day you realize everything feels softer, brighter, lighter, and it's because of them........That's what you are to me........You never needed grand gestures to matter. You mattered in the way you listened, in the way you stayed, in the way you made me feel seen when I didn't even know how to explain myself. With you, I never had to pretend. You accepted me as I am, and that is a gift I will carry with me always.......If I could give you one thing today, it would be a glimpse of yourself through my eyes. You'd see someone who is rare, someone who makes the world gentler just by being in it. I hope you never forget how much light you carry, and how many lives you've quietly made better, mine most of all......So today, I celebrate not just your birthday, but you, the person you are, and the person you will keep becoming. I'm so grateful the universe let our paths cross.........Happy Birthday hhihihihihihihi , and thank you, for everything. 💛❤️"
  ],
 sign:'betuu ❤️'
};
/* ============================ */

(function(){
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let W=0,H=0,DPR=1,groundY,boxX,boxS,boxCY,bowX,bowY,bowH,arrowL,pullMax,bulge,th,small;
let stars=[],grass=[],flies=[],branches=[],cracks=[],targets=[],hearts=[],petals=[];
let running=true,start=0,last=0,raf=0,T=0,flags={};

/* timeline (seconds) */
const T_PULL=0.8,T_REL=2.1,FLY=0.5,T_HIT=T_REL+FLY;
const T_LID=T_HIT+0.45,T_SP0=T_HIT+0.45,T_SP1=T_HIT+2.1;
const T_TREE=T_HIT+2.2,TREE_DUR=3.8,T_FLY0=T_HIT+2.6,T_DONE=T_HIT+7.2;

function groundAt(x){const u=(x-W/2)/(W/2);return groundY-12*(1-u*u)}

/* ---------- heart sprites ---------- */
function heartPath(g,s){g.beginPath();
 g.moveTo(0,-s*.25);
 g.bezierCurveTo(-s*.1,-s*.55,-s*.6,-s*.5,-s*.6,-s*.1);
 g.bezierCurveTo(-s*.6,s*.2,-s*.2,s*.35,0,s*.6);
 g.bezierCurveTo(s*.2,s*.35,s*.6,s*.2,s*.6,-s*.1);
 g.bezierCurveTo(s*.6,-s*.5,s*.1,-s*.55,0,-s*.25);g.closePath()}
const PAL=[['#ffc2d4','#ff4d78','#b0123f'],['#ffd0dc','#ff758f','#c9184a'],['#ffe0ea','#ff8fab','#d63a6a'],['#ffa8b4','#ff2e4d','#9b0d2a'],['#ffe6f0','#ff9ec4','#e0508a'],['#ffcccc','#ff5a5f','#b3202a'],['#f8c8ff','#e070ee','#9b2aa8']];
const SPR=PAL.map(c=>{const s=document.createElement('canvas');s.width=s.height=100;const g=s.getContext('2d');g.translate(50,52);const S=78;
 heartPath(g,S);const gr=g.createRadialGradient(-S*.2,-S*.25,S*.04,0,0,S*.75);gr.addColorStop(0,c[0]);gr.addColorStop(.45,c[1]);gr.addColorStop(1,c[2]);
 g.shadowColor=c[1];g.shadowBlur=9;g.fillStyle=gr;g.fill();g.shadowBlur=0;
 g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-S*.28,-S*.24,S*.13,S*.07,-.6,0,7);g.fill();return s});

/* ---------- layout ---------- */
function layout(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 small=W<600;groundY=H*0.74;
 boxS=Math.min(W,H)*(small?0.17:0.15);
 boxX=W*(small?0.75:0.64);
 bowH=Math.min(H*0.3,W*(small?0.52:0.4),270);
 bowX=W*(small?0.14:0.22);
 bulge=bowH*0.2;pullMax=bowH*0.34;arrowL=bowH*0.62;
 bowY=groundY-bowH*0.66;
 boxCY=bowY-boxS*0.11;
 const r=mulberry(5);
 stars=[];for(let i=0;i<130;i++)stars.push({x:r()*W,y:r()*groundY*0.85,r:r()*1.3+.3,p:r()*6});
 grass=[];for(let i=0;i<220;i++){const x=r()*W;grass.push({x,y:groundAt(x)+r()*Math.max(10,(H-groundY)*0.7),h:5+r()*9,c:r()});}
 flies=[];for(let i=0;i<26;i++)flies.push({x:r()*W,y:groundY-r()*H*0.5,p:r()*6,s:.3+r()*.5});
 buildTree();initHearts();
}

/* ---------- tree ---------- */
function genTree(thh){
 const r=mulberry(11);branches=[];const tips=[];const bx=W/2,by=groundAt(W/2)+2;const baseW=thh*0.05;
 function grow(x,y,ang,len,w,d){
  const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len,bend=(r()-.5)*len*.35;
  const nx=Math.cos(ang+Math.PI/2),ny=Math.sin(ang+Math.PI/2);
  branches.push({x,y,cx:(x+x2)/2+nx*bend,cy:(y+y2)/2+ny*bend,x2,y2,w,w2:w*0.7,d});
  if(d>=3)tips.push({x:x2,y:y2,d});
  if(d>=5)return;
  const kids=d===0?[-0.5,0.02,0.5]:[-(0.28+r()*0.3),(0.28+r()*0.3)];
  if(d>=2&&r()<0.35)kids.push((r()-.5)*0.3);
  kids.forEach(k=>grow(x2,y2,ang+k+(r()-.5)*0.15,len*(0.72+r()*0.08),w*0.68,d+1));
 }
 grow(bx,by,-Math.PI/2,thh*0.3,baseW*1.2,0);
 [Math.PI-0.4,0.4].forEach(a=>{const len=thh*0.07,x2=bx+Math.cos(a)*len,y2=by-4+Math.sin(a)*len;
  branches.push({x:bx,y:by-4,cx:(bx+x2)/2,cy:(by-4+y2)/2-3,x2,y2,w:baseW*0.9,w2:baseW*0.15,d:0})});
 cracks=[];for(let i=0;i<8;i++)cracks.push({u:(r()-.5)*0.7,s0:r()*0.35,s1:0.45+r()*0.5});
 return tips;
}
function buildTree(){
 th=Math.min(H*0.56,W*1.05);
 let tips=genTree(th);
 let mn=1e9,mx=-1e9;tips.forEach(t=>{mn=Math.min(mn,t.x);mx=Math.max(mx,t.x)});
 const k=Math.min(1,(W*0.74)/Math.max(1,mx-mn));
 if(k<1){th*=k;tips=genTree(th)}
 tipsCache=tips;
}
let tipsCache=[];
function qx(b,s){const a=(1-s)*(1-s),c=2*(1-s)*s,d=s*s;return[a*b.x+c*b.cx+d*b.x2,a*b.y+c*b.cy+d*b.y2]}
function qd(b,s){return[2*(1-s)*(b.cx-b.x)+2*s*(b.x2-b.cx),2*(1-s)*(b.cy-b.y)+2*s*(b.y2-b.cy)]}
function drawBranch(b,p){
 const n=Math.max(2,Math.ceil(12*p)),L=[],R=[],C=[];
 for(let i=0;i<=n;i++){const s=p*i/n,[x,y]=qx(b,s),[dx,dy]=qd(b,s),len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,w=lerp(b.w,b.w2,s)/2;
  L.push([x+nx*w,y+ny*w]);R.push([x-nx*w,y-ny*w]);C.push([x+nx*w*.45,y+ny*w*.45])}
 const col='hsl(24,'+(28+b.d*3)+'%,'+(15+b.d*2.6)+'%)';
 ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);L.forEach(q=>ctx.lineTo(q[0],q[1]));
 for(let i=R.length-1;i>=0;i--)ctx.lineTo(R[i][0],R[i][1]);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.arc(qx(b,0)[0],qx(b,0)[1],b.w/2,0,7);ctx.fill();
 ctx.strokeStyle='rgba(255,205,150,.16)';ctx.lineWidth=Math.max(1,b.w*.22);ctx.beginPath();C.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
 ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=Math.max(1,b.w*.12);ctx.beginPath();R.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
 if(b.d===0&&b.w>th*0.03){
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.2;
  cracks.forEach(c=>{if(c.s0>=p)return;ctx.beginPath();const e=Math.min(c.s1,p);
   for(let i=0;i<=8;i++){const s=lerp(c.s0,e,i/8),[x,y]=qx(b,s),[dx,dy]=qd(b,s),len=Math.hypot(dx,dy)||1,w=lerp(b.w,b.w2,s),off=c.u*w+Math.sin(s*20+c.u*9)*w*.05;
    const px=x+(-dy/len)*off,py=y+(dx/len)*off;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
   ctx.stroke()})}
}
function drawTree(prog){
 for(const b of branches){const p=clamp((prog-b.d*0.15)/0.26,0,1);if(p>0)drawBranch(b,easeOut(p))}
}

/* ---------- hearts ---------- */
function initHearts(){
 const r=mulberry(23),N=small?260:380;hearts=[];petals=[];
 const spread=th*0.055;targets=[];
 const tl=tipsCache.length?tipsCache:[{x:W/2,y:groundY-th*0.8,d:5}];
 for(let i=0;i<N;i++){const t=tl[Math.floor(r()*tl.length)];
  const g=()=>(r()+r()+r()-1.5);
  targets.push({x:clamp(t.x+g()*spread*2,14,W-14),y:Math.max(16,t.y+g()*spread*1.7)})}
 targets.sort((a,b)=>b.y-a.y);
 const hs=clamp(W*0.036,13,26);
 for(let i=0;i<N;i++){
  const a=-Math.PI/2+(r()-.5)*2.3,sp=(220+r()*420)*(H/800);
  hearts.push({spr:SPR[Math.floor(r()*SPR.length)],size:hs*(0.7+r()*0.7),rot:(r()-.5)*.9,rs:(r()-.5)*1.5,
   spawn:T_SP0+(i/N)*(T_SP1-T_SP0),x:0,y:0,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,ph:r()*6,
   tx:targets[i].x,ty:targets[i].y,flyAt:T_FLY0+(i/N)*2.4+r()*0.15,D:1.2+r()*0.6,
   side:(r()<.5?-1:1)*(70+r()*110),p0:null,init:false,done:false})

}
function updateHearts(dt){
 for(const h of hearts){
  if(T<h.spawn)continue;
  if(!h.init){h.x=boxX;h.y=boxCY-boxS*0.35;h.init=true}
  if(T<h.flyAt){
   h.x+=h.vx*dt;h.y+=h.vy*dt;h.vx*=Math.exp(-1.7*dt);h.vy*=Math.exp(-1.5*dt);h.vy+=-8*dt;
   h.rot+=h.rs*dt;h.dx=Math.sin(T*2+h.ph)*5;h.dy=Math.cos(T*1.7+h.ph)*4;
  }else if(!h.done){
   if(!h.p0)h.p0={x:h.x+(h.dx||0),y:h.y+(h.dy||0)};
   const u=clamp((T-h.flyAt)/h.D,0,1),e=ease(u);
   const mx=(h.p0.x+h.tx)/2+h.side,my=(h.p0.y+h.ty)/2-30;
   const a=(1-e)*(1-e),b=2*(1-e)*e,c=e*e;
   h.x=a*h.p0.x+b*mx+c*h.tx;h.y=a*h.p0.y+b*my+c*h.ty;h.dx=0;h.dy=0;h.rot*=(1-0.03);
   if(u>=1)h.done=true;
  }else{h.x=h.tx;h.y=h.ty;h.dx=Math.sin(T*1.1+h.ph)*2.2;h.dy=Math.cos(T*1.3+h.ph)*1.6}
 }
 if(T>T_DONE-1&&hearts.length){
  if(Math.random()<dt*5){const t=targets[Math.floor(Math.random()*targets.length)];
   petals.push({x:t.x,y:t.y,vx:(Math.random()-.5)*14,vy:18+Math.random()*20,s:clamp(W*0.022,9,16)*(0.7+Math.random()*0.6),spr:SPR[Math.floor(Math.random()*SPR.length)],life:0,max:4+Math.random()*2.5,ph:Math.random()*6,rot:Math.random()*3})}
 }
 for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.life+=dt;p.x+=(p.vx+Math.sin(T*2+p.ph)*16)*dt;p.y+=p.vy*dt;p.rot+=dt;if(p.life>p.max)petals.splice(i,1)}
}
function drawHearts(){
 for(const h of hearts){
  if(!h.init)continue;
  const k=clamp((T-h.spawn)/0.25,0,1);
  let s=h.size*k;if(h.done)s*=1+Math.sin(T*2.4+h.ph)*0.05;
  ctx.save();ctx.translate(h.x+(h.dx||0),h.y+(h.dy||0));ctx.rotate(h.rot);ctx.drawImage(h.spr,-s,-s,s*2,s*2);ctx.restore();
 }
 for(const p of petals){const a=Math.min(1,p.life*2)*clamp(1-(p.life-(p.max-1.2))/1.2,0,1);
  ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.drawImage(p.spr,-p.s,-p.s,p.s*2,p.s*2);ctx.restore()}
}

/* ---------- bow / arrow / box ---------- */
function bowPt(s){const p0x=bowX,p0y=bowY-bowH/2,cx=bowX+2*bulge,cy=bowY,p1x=bowX,p1y=bowY+bowH/2;
 const a=(1-s)*(1-s),b=2*(1-s)*s,c=s*s;
 return{x:a*p0x+b*cx+c*p1x,y:a*p0y+b*cy+c*p1y,dx:2*(1-s)*(cx-p0x)+2*s*(p1x-cx),dy:2*(1-s)*(cy-p0y)+2*s*(p1y-cy)}}
function drawBow(alpha,nockX){
 const k=bowH/200,N=28,Lp=[],Rp=[],Cp=[];
 for(let i=0;i<=N;i++){const s=i/N,p=bowPt(s),len=Math.hypot(p.dx,p.dy)||1,nx=-p.dy/len,ny=p.dx/len,w=(2.5+8.5*Math.pow(Math.sin(Math.PI*s),0.7))*k;
  Lp.push([p.x+nx*w/2,p.y+ny*w/2]);Rp.push([p.x-nx*w/2,p.y-ny*w/2]);Cp.push([p.x+nx*w*.18,p.y+ny*w*.18])}
 ctx.save();ctx.globalAlpha=alpha;
 // string
 const t0=bowPt(0),t1=bowPt(1);
 ctx.strokeStyle='#f3e6c8';ctx.lineWidth=Math.max(1.2,1.7*k);ctx.beginPath();ctx.moveTo(t0.x,t0.y);ctx.lineTo(nockX,bowY);ctx.lineTo(t1.x,t1.y);ctx.stroke();
 // limb
 const g=ctx.createLinearGradient(bowX,0,bowX+bulge*1.4,0);g.addColorStop(0,'#7a4521');g.addColorStop(.45,'#c07c3e');g.addColorStop(1,'#6e3c1b');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(Lp[0][0],Lp[0][1]);Lp.forEach(q=>ctx.lineTo(q[0],q[1]));for(let i=Rp.length-1;i>=0;i--)ctx.lineTo(Rp[i][0],Rp[i][1]);ctx.closePath();ctx.fill();
 ctx.strokeStyle='rgba(255,225,175,.4)';ctx.lineWidth=Math.max(1,1.8*k);ctx.beginPath();Cp.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
 // grip
 ctx.strokeStyle='#2c1810';ctx.lineWidth=11*k;ctx.lineCap='round';ctx.beginPath();
 for(let i=0;i<=8;i++){const p=bowPt(lerp(.42,.58,i/8));i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.stroke();
 ctx.strokeStyle='#e8c05a';ctx.lineWidth=2*k;[.41,.59].forEach(s=>{const p=bowPt(s),len=Math.hypot(p.dx,p.dy),nx=-p.dy/len,ny=p.dx/len;ctx.beginPath();ctx.moveTo(p.x-nx*7*k,p.y-ny*7*k);ctx.lineTo(p.x+nx*7*k,p.y+ny*7*k);ctx.stroke()});
 // tips
 ctx.fillStyle='#e8c05a';[t0,t1].forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,3.4*k,0,7);ctx.fill()});
 ctx.restore();
}
function drawArrow(x,y,a,alpha){
 const L=arrowL,hl=L*0.11,sw=Math.max(2.4,bowH*0.012);
 ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=alpha;
 // feathers
 ctx.fillStyle='#ff5d8f';[-1,1].forEach(sg=>{ctx.beginPath();ctx.moveTo(-L*.99,sg*sw*.3);ctx.lineTo(-L*.84,sg*sw*.3);ctx.lineTo(-L*.78,sg*sw*3.6);ctx.lineTo(-L*.94,sg*sw*3.6);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(120,10,50,.5)';ctx.lineWidth=.8;ctx.stroke()});
 const g=ctx.createLinearGradient(0,-sw,0,sw);g.addColorStop(0,'#ecc98f');g.addColorStop(.5,'#b9854a');g.addColorStop(1,'#7a4f26');
 ctx.fillStyle=g;ctx.fillRect(-L,-sw/2,L-hl,sw);
 ctx.fillStyle='#3a2314';ctx.fillRect(-L,-sw*.7,sw*.7,sw*1.4);
 const hg=ctx.createLinearGradient(0,-sw*2,0,sw*2);hg.addColorStop(0,'#f2f4f7');hg.addColorStop(.5,'#9aa3ad');hg.addColorStop(1,'#d9dee4');
 ctx.fillStyle=hg;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-hl*1.3,-sw*2);ctx.lineTo(-hl*.85,0);ctx.lineTo(-hl*1.3,sw*2);ctx.closePath();ctx.fill();
 ctx.restore();
}
function poly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function drawBox(cx,cy,s,alpha,lift,lrot,lalpha){
 const bodyH=s*.72,lidH=s*.22,d=s*.26,x0=cx-s/2,x1=cx+s/2,y1=cy+s*.47,y0=y1-bodyH,rw=s*.17;
 ctx.save();ctx.globalAlpha=alpha;
 let g=ctx.createLinearGradient(x0,0,x1,0);g.addColorStop(0,'#ff4d7d');g.addColorStop(.5,'#ff2f6a');g.addColorStop(1,'#d9124f');
 ctx.fillStyle=g;ctx.fillRect(x0,y0,s,bodyH);
 ctx.fillStyle='#a80d3d';poly([[x1,y0],[x1+d,y0-d*.55],[x1+d,y1-d*.55],[x1,y1]]);
 const gold=ctx.createLinearGradient(x0,0,x1,0);gold.addColorStop(0,'#e9b43f');gold.addColorStop(.5,'#ffe08a');gold.addColorStop(1,'#d9a02a');
 ctx.fillStyle=gold;ctx.fillRect(cx-rw/2,y0,rw,bodyH);ctx.fillRect(x0,(y0+y1)/2-rw/2,s,rw);
 ctx.fillStyle='#c98f1f';const my=(y0+y1)/2;poly([[x1,my-rw/2],[x1+d,my-rw/2-d*.55],[x1+d,my+rw/2-d*.55],[x1,my+rw/2]]);
 // lid
 ctx.save();ctx.translate(cx,y0-lift);ctx.rotate(lrot);ctx.translate(-cx,-y0);ctx.globalAlpha=alpha*lalpha;
 const lx0=x0-s*.04,lx1=x1+s*.04,ly1=y0+2,ly0=y0-lidH;
 ctx.fillStyle='#ff3d73';ctx.fillRect(lx0,ly0,lx1-lx0,ly1-ly0);
 ctx.fillStyle='#ff86a8';poly([[lx0,ly0],[lx1,ly0],[lx1+d,ly0-d*.55],[lx0+d,ly0-d*.55]]);
 ctx.fillStyle='#b8104a';poly([[lx1,ly0],[lx1+d,ly0-d*.55],[lx1+d,ly1-d*.55],[lx1,ly1]]);
 ctx.fillStyle=gold;ctx.fillRect(cx-rw/2,ly0,rw,ly1-ly0);
 ctx.fillStyle='#ffd978';poly([[cx-rw/2,ly0],[cx+rw/2,ly0],[cx+rw/2+d,ly0-d*.55],[cx-rw/2+d,ly0-d*.55]]);
 const bx=cx+d/2,by=ly0-d*.3;
 [-1,1].forEach(sg=>{ctx.save();ctx.translate(bx,by);ctx.rotate(sg*.55);ctx.fillStyle='#f3c04a';ctx.strokeStyle='#b8861c';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.ellipse(sg*s*.17,-s*.02,s*.19,s*.1,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,240,180,.55)';ctx.beginPath();ctx.ellipse(sg*s*.17,-s*.04,s*.12,s*.04,0,0,7);ctx.fill();ctx.restore()});
 ctx.fillStyle='#e0a834';ctx.beginPath();ctx.arc(bx,by,s*.065,0,7);ctx.fill();
 ctx.restore();ctx.restore();
 return{topY:ly0-d*.55,x:cx+d/2};
}

/* ---------- scenery ---------- */
function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,groundY);g.addColorStop(0,'#070b24');g.addColorStop(.55,'#241548');g.addColorStop(1,'#6a2a64');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(T*1.2+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
 ctx.globalAlpha=1;
 const mx=W*(small?0.2:0.14),my=H*0.2,mr=Math.min(W,H)*0.055;
 const mg=ctx.createRadialGradient(mx,my,mr*.8,mx,my,mr*4);mg.addColorStop(0,'rgba(255,240,200,.35)');mg.addColorStop(1,'rgba(255,240,200,0)');
 ctx.fillStyle=mg;ctx.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
 const mg2=ctx.createRadialGradient(mx-mr*.3,my-mr*.3,mr*.1,mx,my,mr);mg2.addColorStop(0,'#fffbe6');mg2.addColorStop(1,'#f1dfa6');
 ctx.fillStyle=mg2;ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
 ctx.fillStyle='rgba(180,150,90,.18)';[[.3,.2,.18],[-.35,.1,.12],[.05,-.4,.1]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0]*mr,my+c[1]*mr,c[2]*mr,0,7);ctx.fill()});
}
function drawGround(){
 const g=ctx.createLinearGradient(0,groundY-20,0,H);g.addColorStop(0,'#1f4a3a');g.addColorStop(.4,'#143528');g.addColorStop(1,'#0a1d17');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,H);
 for(let i=0;i<=30;i++){const x=W*i/30;ctx.lineTo(x,groundAt(x))}
 ctx.lineTo(W,H);ctx.closePath();ctx.fill();
 ctx.lineWidth=1.3;
 for(const t of grass){ctx.strokeStyle=t.c<.5?'#2f7a56':'#3f9a68';ctx.globalAlpha=.7;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.quadraticCurveTo(t.x+2,t.y-t.h*.6,t.x+Math.sin(T+t.x)*2+3,t.y-t.h);ctx.stroke()}
 ctx.globalAlpha=1;
 // soft shadow under tree
 if(T>T_TREE){const a=clamp((T-T_TREE)/2,0,1)*.35;const sh=ctx.createRadialGradient(W/2,groundAt(W/2)+4,2,W/2,groundAt(W/2)+4,th*0.35);sh.addColorStop(0,'rgba(0,0,0,'+a+')');sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();ctx.translate(0,groundAt(W/2)+4);ctx.scale(1,.22);ctx.translate(0,-(groundAt(W/2)+4));ctx.fillStyle=sh;ctx.fillRect(W/2-th*.4,groundAt(W/2)-th*.4,th*.8,th*.8*1.5);ctx.restore()}
}
function drawFlies(dt){
 for(const f of flies){f.x+=Math.cos(T*f.s+f.p)*10*dt;f.y+=Math.sin(T*f.s*1.3+f.p)*8*dt;if(f.x<0)f.x=W;if(f.x>W)f.x=0;
  const a=.35+.65*Math.abs(Math.sin(T*1.5+f.p));ctx.fillStyle='rgba(255,240,150,'+a*.25+')';ctx.beginPath();ctx.arc(f.x,f.y,6,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,250,200,'+a+')';ctx.beginPath();ctx.arc(f.x,f.y,1.6,0,7);ctx.fill()}
}

/* ---------- main draw ---------- */
function draw(dt){
 drawSky();drawGround();
 // tree
 const prog=clamp((T-T_TREE)/TREE_DUR,0,1);if(prog>0)drawTree(prog);
 drawFlies(dt);
 const boxIn=clamp(T/0.7,0,1),boxFade=1-clamp((T-(T_TREE+0.1))/1.0,0,1);
 const bowAlpha=clamp(T/0.6,0,1)*(1-clamp((T-(T_HIT+0.9))/0.9,0,1));
 const bob=Math.sin(T*2.2)*4*(1-clamp((T-(T_REL-0.4))/0.4,0,1));
 const since=T-T_HIT,shake=since>0&&since<0.5?Math.sin(since*70)*(1-since/0.5)*5:0;
 // bow + arrow in flight
 if(bowAlpha>0.01){
  let nock=bowX;
  if(T<T_REL){const pl=ease(clamp((T-T_PULL)/(T_REL-T_PULL),0,1));nock=bowX-pl*pullMax}
  else{const e=T-T_REL;nock=bowX+Math.sin(e*55)*Math.exp(-e*7)*pullMax*0.25}
  drawBow(bowAlpha,nock);
 }
 // gift box
 if(boxFade>0.01){
  const cy=boxCY+bob;
  const aura=ctx.createRadialGradient(boxX,cy,boxS*.2,boxX,cy,boxS*1.8);aura.addColorStop(0,'rgba(255,200,120,'+(.28*boxIn*boxFade)+')');aura.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=aura;ctx.fillRect(boxX-boxS*2,cy-boxS*2,boxS*4,boxS*4);
  const lidT=T-T_LID;
  const lift=lidT>0?easeOut(clamp(lidT/0.5,0,1))*boxS*0.9:0,lrot=lidT>0?easeOut(clamp(lidT/0.7,0,1))*-0.55:0,lal=lidT>0?1-clamp((lidT-0.4)/0.7,0,1):1;
  const sc=(0.75+0.25*boxIn)*(1-0.3*(1-boxFade));
  ctx.save();ctx.translate(boxX+shake,cy);ctx.scale(sc,sc);ctx.rotate(shake*0.006);ctx.translate(-boxX,-cy);
  const info=drawBox(boxX,cy,boxS,boxIn*boxFade,lift,lrot,lal);
  ctx.restore();
  // glow from open box
  if(lidT>0){const ga=clamp(lidT/0.3,0,1)*(1-clamp((T-T_SP1)/1.2,0,1));
   if(ga>0){const gr=ctx.createRadialGradient(boxX,cy-boxS*.3,2,boxX,cy-boxS*.3,boxS*2.4);gr.addColorStop(0,'rgba(255,230,160,'+.85*ga*boxFade+')');gr.addColorStop(.4,'rgba(255,150,190,'+.35*ga*boxFade+')');gr.addColorStop(1,'rgba(255,150,190,0)');
    ctx.fillStyle=gr;ctx.fillRect(boxX-boxS*3,cy-boxS*3,boxS*6,boxS*6)}}
 }
 // arrow
 const arrowAlpha=Math.min(clamp((T-0.5)/0.4,0,1),boxFade<1?boxFade:1)*(T>T_HIT?1:1);
 if(arrowAlpha>0.01){
  const yHit=boxCY+boxS*0.11,tipEnd=boxX-boxS*0.5+boxS*0.42,arcH=boxS*0.12;
  if(T<T_REL){const pl=ease(clamp((T-T_PULL)/(T_REL-T_PULL),0,1));const tail=bowX-pl*pullMax;drawArrow(tail+arrowL,bowY,0,arrowAlpha)}
  else{
   const tipStart=bowX-pullMax+arrowL,u=clamp((T-T_REL)/FLY,0,1);
   const x=lerp(tipStart,tipEnd,u),y=lerp(bowY,yHit,u)-arcH*4*u*(1-u);
   const dydu=(yHit-bowY)-arcH*4*(1-2*u),a=Math.atan2(dydu,tipEnd-tipStart);
   ctx.save();
   if(u>=1){ctx.translate(shake,0);const sc=1-0.3*(1-boxFade);ctx.translate(boxX,boxCY);ctx.scale(sc,sc);ctx.translate(-boxX,-boxCY)}
   drawArrow(x,y,a,arrowAlpha);ctx.restore();
   // impact flash
   if(since>0&&since<0.35){const fa=1-since/0.35;const fg=ctx.createRadialGradient(tipEnd,yHit,0,tipEnd,yHit,boxS*1.1);fg.addColorStop(0,'rgba(255,255,255,'+fa+')');fg.addColorStop(1,'rgba(255,200,230,0)');ctx.fillStyle=fg;ctx.fillRect(tipEnd-boxS,yHit-boxS,boxS*2,boxS*2)}
  }
 }
 updateHearts(dt);drawHearts();
 // DOM timing
 if(!flags.hint&&T>0.3){flags.hint=1;$('hint').classList.add('on')}
 if(!flags.hint2&&T>T_HIT+0.2){flags.hint2=1;$('hint').classList.remove('on')}
 if(!flags.sign&&T>T_DONE-0.6){flags.sign=1;$('sign').classList.add('on')}
 if(!flags.next&&T>T_DONE+0.4){flags.next=1;$('next').classList.add('on')}
}
function frame(now){
 if(!running)return;
 if(!start){start=now;last=now}
 T=(now-start)/1000;const dt=Math.min(.05,(now-last)/1000||.016);last=now;
 draw(dt);raf=requestAnimationFrame(frame);
}

function showS2(){
 if(!s2built){$('heroImg').src=HERO_PHOTO;buildBg();buildLetter();s2built=true}
 $('s2').scrollTop=0;buildLights();buildRopes();
 document.body.style.overflow='hidden';
 $('s2').classList.add('on');
}
let rzT;addEventListener('resize',()=>{if($('s2').classList.contains('on')){clearTimeout(rzT);rzT=setTimeout(()=>{buildLights();buildRopes()},200)}});
$('next').onclick=()=>{
 $('s1').style.opacity=0;
 setTimeout(()=>{$('s1').style.display='none';running=false;cancelAnimationFrame(raf);showS2()},800);
};
$('again').onclick=()=>{
 $('s2').classList.remove('on');
 setTimeout(()=>{
  ['hint','sign','next'].forEach(i=>$(i).classList.remove('on'));
  flags={};start=0;T=0;
  $('s1').style.display='block';$('s1').style.opacity=1;
  initHearts();running=true;raf=requestAnimationFrame(frame);
 },900);
};
})();
</script>
